<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>everyday and epic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&display=swap" rel="stylesheet">
<style>
  /* ─── Base ─────────────────────────────────────────── */
  :root {
    --bg: #000;
    --ink: #6B1C23;
    --paper: #f0e6d8;
    --whisper: rgba(240, 230, 216, 0.4);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    background: var(--bg);
    color: var(--paper);
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }
  body { cursor: default; }
  img { display: block; user-select: none; -webkit-user-drag: none; }

  /* ─── Entry: title + two faces ─────────────────────── */
  .entry {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 3vh 2rem 3vh;
    position: relative;
    gap: 2vh;
  }
  .entry .title {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-style: italic;
    color: var(--ink);
    transform: scaleY(1.9);
    transform-origin: center;
    font-size: clamp(1.8rem, 6vw, 5rem);
    line-height: 1;
    letter-spacing: -0.01em;
    margin-bottom: 4vh;
    user-select: none;
  }
  .entry .title span { display: inline; }
  .entry .title .and {
    font-size: 0.85em;
    opacity: 0.85;
    margin: 0 0.2em;
  }

  .faces {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 3vw;
    width: min(75vw, 780px);
  }

  .face-half {
    position: relative;
    cursor: pointer;
    transition: transform 0.7s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .face-half:hover { transform: translateY(-6px); }

  .face-img-wrap {
    position: relative;
    aspect-ratio: 3 / 4;
    overflow: hidden;
    background: transparent;
  }
  .face-img-wrap img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    object-position: center center;
    transition: filter 0.7s ease, transform 1.4s cubic-bezier(0.16, 1, 0.3, 1);
    filter: brightness(0.95) contrast(1.02);
  }
  .face-half:hover .face-img-wrap img {
    filter: brightness(1.05) contrast(1.05);
    transform: scale(1.025);
  }

  .choice-hint {
    color: var(--whisper);
    font-style: italic;
    font-size: clamp(0.85rem, 1.4vw, 1.05rem);
    letter-spacing: 0.25em;
    text-align: center;
    pointer-events: none;
    animation: pulse 3.5s ease-in-out infinite;
    margin-top: 2vh;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.5; }
    50% { opacity: 1; }
  }

  @media (max-width: 720px) {
    .faces { gap: 2vw; width: 90vw; }
    .entry .title { transform: scaleY(1.6); font-size: clamp(1.4rem, 5vw, 2.5rem); }
  }

  /* ─── Main Story Screens ────────────────────────────── */
  .story { display: none; }
  .story.active { display: block; }

  .screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 4rem 2rem;
    position: relative;
  }
  .screen.tight { padding: 2rem; }

  .single img {
    max-width: min(85vw, 1100px);
    max-height: 88vh;
    width: auto;
    height: auto;
    object-fit: contain;
  }

  /* Double image side by side */
  .double {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 2vw;
    width: min(95vw, 1500px);
  }
  .double img {
    width: 100%;
    max-height: 80vh;
    object-fit: contain;
  }

  /* Grid of 6 — noisy mosaic */
  .grid-6 {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(2, 1fr);
    gap: 8px;
    width: min(96vw, 1500px);
    height: 88vh;
  }
  .grid-6 img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  /* Crossfade three palm-light images */
  .crossfade-3 {
    position: relative;
    width: min(85vw, 1100px);
    aspect-ratio: 3 / 2;
  }
  .crossfade-3 img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    opacity: 0;
    animation: crossfade 9s infinite;
  }
  .crossfade-3 img:nth-child(1) { animation-delay: 0s; }
  .crossfade-3 img:nth-child(2) { animation-delay: 3s; }
  .crossfade-3 img:nth-child(3) { animation-delay: 6s; }
  @keyframes crossfade {
    0%   { opacity: 0; }
    8%   { opacity: 1; }
    33%  { opacity: 1; }
    41%  { opacity: 0; }
    100% { opacity: 0; }
  }

  /* ─── Third Act — the line + final face ──────────── */
  .final-line {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 4rem 2rem;
    text-align: center;
  }
  .final-line p {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 300;
    color: var(--paper);
    font-size: clamp(1.3rem, 2.6vw, 2rem);
    line-height: 1.9;
    max-width: 720px;
    letter-spacing: 0.02em;
  }
  .final-line p + p { margin-top: 1.2rem; }
  .final-line .signature {
    margin-top: 4rem;
    color: var(--ink);
    font-style: italic;
    font-size: clamp(1.5rem, 3vw, 2.4rem);
  }

  .final-face {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 4rem 2rem;
  }
  .final-face .placeholder {
    width: min(60vw, 380px);
    aspect-ratio: 3 / 4;
    background: linear-gradient(180deg, #1a1a1a 0%, #0a0a0a 100%);
    border: 1px solid rgba(240, 230, 216, 0.08);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: rgba(240, 230, 216, 0.25);
    font-style: italic;
    font-size: 0.9rem;
    letter-spacing: 0.1em;
    padding: 2rem;
    text-align: center;
    line-height: 1.8;
  }

  /* ─── Scroll-triggered reveal ─────────────────────── */
  .screen { opacity: 0; transition: opacity 0.9s ease-out; }
  .screen.in-view { opacity: 1; }

  /* ─── Return-to-start link at end ─────────────────── */
  .restart {
    min-height: 60vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }
  .restart button {
    background: none;
    border: 1px solid var(--ink);
    color: var(--ink);
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: clamp(1rem, 1.6vw, 1.3rem);
    letter-spacing: 0.2em;
    padding: 1.2rem 3rem;
    cursor: pointer;
    transition: all 0.4s ease;
  }
  .restart button:hover {
    background: var(--ink);
    color: var(--paper);
  }

  /* ─── Responsive — collapse doubles & grid on mobile ── */
  @media (max-width: 720px) {
    .double { grid-template-columns: 1fr; gap: 1rem; }
    .double img { max-height: 45vh; }
    .grid-6 { grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(3, 1fr); height: 90vh; }
    .choice { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
    .title { transform: scaleY(1.8); }
  }
</style>
</head>
<body>

<!-- ════════════════════════════════════════════════════════════ -->
<!--  ACT I — Opening: title + two faces as the choice            -->
<!-- ════════════════════════════════════════════════════════════ -->

<section class="entry">
  <h1 class="title">

    <span class="and"><em>and</em></span>

  <div class="faces">

    <div class="crossfade-3">

      <img src="photos/subway_seat.jpg" alt="" style="filter: hue-rotate(90deg) saturate(0.6) brightness(0.5);">

</main>

<script>
  // ─── Choice handling ───────────────────────────────────────
  function choose(direction) {
    const story = document.getElementById('story');
    const screens = Array.from(story.querySelectorAll('.screen'));
    const restartBtn = story.querySelector('.restart');
    // The last two screens (final-line + final-face) belong to Act III;
    // everything before them is the reversible main sequence.
    const finalCount = 2;
    const main = screens.slice(0, screens.length - finalCount);
    const finalScreens = screens.slice(screens.length - finalCount);

    if (direction === 'outward-in') {
      // Reverse only the main sequence; keep the third act in place
      main.slice().reverse().forEach(s => story.appendChild(s));
      finalScreens.forEach(s => story.appendChild(s));
    }
    // For 'inward-out' we leave the natural DOM order untouched

    // Make sure restart button always sits at the very end
    if (restartBtn) story.appendChild(restartBtn);

    story.classList.add('active');
    // hide entry (title + face choice)
    document.querySelectorAll('.entry').forEach(el => el.style.display = 'none');

    // smooth scroll to top of story
    window.scrollTo({ top: 0, behavior: 'instant' });
  }

  // ─── Restart ───────────────────────────────────────────────
  function restart() {
    location.reload();
  }

  // ─── Scroll-triggered reveal ──────────────────────────────
  const io = new IntersectionObserver((entries) => {
    entries.forEach(e => {
      if (e.isIntersecting) e.target.classList.add('in-view');
    });
  }, { threshold: 0.15 });

  document.querySelectorAll('.screen').forEach(s => io.observe(s));
</script>
