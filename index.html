<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  background: #0a0a0a;
  width: 100%;
  overflow-x: hidden;
}

body {
  color: #e8e4df;
  font-family: 'Cormorant Garamond', serif;
}

/* ===== Scale wrapper: keeps desktop 16:9 layout, scales for any screen width ===== */
#scale-wrap {
  width: 1920px;
  transform-origin: top left;
  /* JS sets transform: scale() based on viewport width */
}

.screen {
  width: 1920px;
  height: 1080px;
  position: relative;
  overflow: hidden;
  opacity: 0;
  transition: opacity 1.2s ease;
}
.screen.visible { opacity: 1; }
.screen img { position: absolute; object-fit: cover; height: auto; }

/* ============ CHOICE SCREEN (also opening) ============ */
#choice-screen {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  opacity: 1;
  gap: 40px;
  padding: 80px 40px;
}

.choice-title {
  font-family: 'Cormorant Garamond', serif;
  font-weight: 300;
  font-style: italic;
  font-size: 52px;
  letter-spacing: 0.2em;
  color: #6B1C23;
  text-transform: lowercase;
  opacity: 0;
  animation: titleIn 2s ease 0.3s forwards;
  text-align: center;
  white-space: nowrap;
}

.choice-subtitle {
  font-family: 'Cormorant Garamond', serif;
  font-weight: 300;
  font-style: italic;
  font-size: 20px;
  letter-spacing: 0.6em;
  color: #aaa;
  text-transform: lowercase;
  opacity: 0;
  animation: subIn 2s ease 2.2s forwards;
  margin-top: 40px;
}

@keyframes titleIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes subIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

.choice-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 80px;
  margin-top: 40px;
}

.choice-btn {
  cursor: pointer;
  border: none;
  background: none;
  padding: 0;
  opacity: 0;
  animation: faceIn 2s ease 1.5s forwards;
}
@keyframes faceIn {
  from { opacity: 0; }
  to { opacity: 1; }
}
.choice-btn img {
  position: relative;
  height: 540px;
  width: auto;
  object-fit: contain;
  filter: brightness(1);
  transition: filter 0.6s, transform 0.6s, opacity 0.6s;
}
.choice-btn:hover img {
  filter: brightness(1.1);
  transform: scale(1.03);
}
.choice-row:hover .choice-btn:not(:hover) img {
  filter: brightness(0.5);
}
.choice-divider {
  width: 1px;
  height: 280px;
  background: #222;
  opacity: 0;
  animation: faceIn 2s ease 1.5s forwards;
}

/* ============ PATH CONTAINERS ============ */
.path-container { display: none; }
.path-container.active { display: block; }
#shared-ending { display: none; }
#shared-ending.active { display: block; }

/* ============ ENDING ============ */
#ending-photo {
  display: flex;
  align-items: center;
  justify-content: center;
}
#ending-photo img {
  position: relative;
  max-height: 700px;
  max-width: 1050px;
  object-fit: contain;
  opacity: 0;
  transition: opacity 2.5s ease;
}
#ending-photo img.visible { opacity: 1; }

/* ============ FINAL "WALK ANOTHER WAY" SCREEN ============ */
#walk-back {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  gap: 48px;
  padding: 48px;
}
.walk-link {
  font-family: 'Cormorant Garamond', serif;
  font-weight: 300;
  font-style: italic;
  font-size: 52px;
  letter-spacing: 0.15em;
  color: #e8e4df;
  background: none;
  border: none;
  cursor: pointer;
  padding: 8px 16px;
  opacity: 0;
  transition: opacity 2.5s ease, color 0.6s, letter-spacing 0.6s;
  text-transform: lowercase;
}
.walk-link.visible { opacity: 1; }
.walk-link:hover {
  color: #6B1C23;
  letter-spacing: 0.25em;
}
.walk-sub-en {
  font-style: italic;
  font-weight: 300;
  font-size: 22px;
  letter-spacing: 0.18em;
  color: #888;
  opacity: 0;
  transition: opacity 2.5s ease 0.4s;
}
.walk-sub-en.visible { opacity: 1; }

.scroll-hint {
  position: fixed;
  bottom: 1.5rem;
  left: 50%;
  transform: translateX(-50%);
  font-size: 0.6rem;
  letter-spacing: 0.5em;
  color: #333;
  z-index: 99;
  transition: opacity 1s;
}
.scroll-hint.gone { opacity: 0; pointer-events: none; }
</style>

<script>
/* ===== Responsive scaling: desktop uses scaled 1920 design; mobile uses native viewport ===== */
function scaleApp() {
  const wrap = document.getElementById('scale-wrap');
  if (!wrap) return;
  const designWidth = 1920;
  const designHeight = 1080;
  const isMobile = window.innerWidth < 768;

  if (isMobile) {
    // Mobile: scale so one screen fills the mobile viewport height (not width)
    // This keeps each .screen filling the visible area without huge black bars
    const scale = window.innerHeight / designHeight;
    wrap.style.transform = 'scale(' + scale + ')';
    wrap.style.width = designWidth + 'px';
    // Horizontal overflow will be cropped, content stays centered on width
    wrap.style.transformOrigin = 'top left';
    // Center horizontally: shift wrap so center of design is at center of viewport
    const scaledWidth = designWidth * scale;
    const offsetX = (window.innerWidth - scaledWidth) / 2;
    wrap.style.marginLeft = offsetX + 'px';
    document.body.style.height = (wrap.scrollHeight * scale) + 'px';
  } else {
    // Desktop: scale to fill viewport width
    const scale = window.innerWidth / designWidth;
    wrap.style.transform = 'scale(' + scale + ')';
    wrap.style.width = designWidth + 'px';
    wrap.style.transformOrigin = 'top left';
    wrap.style.marginLeft = '0px';
    document.body.style.height = (wrap.scrollHeight * scale) + 'px';
  }
}
window.addEventListener('resize', scaleApp);
window.addEventListener('load', scaleApp);
scaleApp();

function choosePath(path) {
  const choice = document.getElementById('choice-screen');
  choice.style.transition = 'opacity 1s ease';
  choice.style.opacity = '0';
  setTimeout(() => {
    choice.style.display = 'none';
    document.getElementById(path === 'A' ? 'pathA' : 'pathB').classList.add('active');
    document.getElementById('shared-ending').classList.add('active');
    scaleApp();
    observeAll();
    window.scrollTo({ top: 0, behavior: 'instant' });
    setTimeout(() => {
      const target = document.querySelector((path === 'A' ? '#pathA' : '#pathB') + ' .screen');
      if (target) target.scrollIntoView({ behavior: 'smooth' });
    }, 200);
  }, 1000);
}

function walkAnotherWay() {
  // Fade out current screens, reset to choice
  document.body.style.transition = 'opacity 0.8s ease';
  document.body.style.opacity = '0';
  setTimeout(() => {
    document.getElementById('pathA').classList.remove('active');
    document.getElementById('pathB').classList.remove('active');
    document.getElementById('shared-ending').classList.remove('active');
    const choice = document.getElementById('choice-screen');
    choice.style.display = 'flex';
    choice.style.opacity = '1';
    // reset visited classes
    document.querySelectorAll('.screen.visible').forEach(s => {
      if (s.id !== 'choice-screen') s.classList.remove('visible');
    });
    document.querySelectorAll('.walk-link, .walk-sub-en, #ending-photo img').forEach(el => el.classList.remove('visible'));
    window.scrollTo({ top: 0, behavior: 'instant' });
    scaleApp();
    document.body.style.opacity = '1';
  }, 800);
}

function observeAll() {
  const obs = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (e.isIntersecting) {
        e.target.classList.add('visible');
        e.target.querySelectorAll('#ending-photo img, .walk-link, .walk-sub-en').forEach(el => el.classList.add('visible'));
      }
    });
  }, { threshold: 0.15 });
  document.querySelectorAll('.screen').forEach(s => obs.observe(s));
}

let hinted = false;
window.addEventListener('scroll', () => {
  if (!hinted && scrollY > 80) { hinted = true; document.getElementById('sh').classList.add('gone'); }
}, { passive: true });

observeAll();
</script>
