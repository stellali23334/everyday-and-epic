<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>everyday and epic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0a;
    --text: #e8e4df;
    --ink: #6B1C23;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html {
    scroll-behavior: smooth;
    scroll-snap-type: y mandatory;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  img {
    display: block;
    user-select: none;
    -webkit-user-drag: none;
  }

  /* ─── Full-screen sections ─────────────────────────── */
  .screen {
    position: relative;
    width: 100vw;
    height: 100vh;
    min-height: 100vh;
    scroll-snap-align: start;
    scroll-snap-stop: always;
    overflow: hidden;
    background: var(--bg);
  }

  .screen.reveal {
    opacity: 0;
    transition: opacity 1.2s ease;
  }

  .screen.reveal.in-view {
    opacity: 1;
  }

  /* ─── Act I · Screen 1 — opening photo ─────────────── */
  .screen-opening-photo {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .screen-opening-photo img {
    max-height: 85vh;
    width: auto;
    max-width: 92vw;
    object-fit: contain;
    opacity: 0;
    transform: scale(1.02);
    animation: openingFade 3s ease forwards;
  }

  @keyframes openingFade {
    to {
      opacity: 1;
      transform: scale(1);
    }
  }

  /* ─── Act I · Screen 2 — title ─────────────────────── */
  .screen-title {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .screen-title h1 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-size: clamp(1.4rem, 4.5vw, 3.2rem);
    letter-spacing: 0.35em;
    color: var(--ink);
    transform: scaleX(1.6);
    transform-origin: center;
    text-indent: 0.35em;
    opacity: 0;
    animation: titleFade 1.8s ease 0.15s forwards;
  }

  @keyframes titleFade {
    to { opacity: 1; }
  }

  /* ─── Act I · Screen 3 — choice ──────────────────── */
  .screen-choice {
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 1s ease;
  }

  .screen-choice.is-done {
    opacity: 0;
    pointer-events: none;
  }

  .choice-stage {
    position: relative;
    width: min(88vw, 1100px);
    height: min(72vh, 780px);
  }

  .choice-stage img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .choice-half {
    position: absolute;
    top: 0;
    width: 50%;
    height: 100%;
    overflow: hidden;
    cursor: pointer;
    border: none;
    padding: 0;
    background: transparent;
  }

  .choice-half--left { left: 0; }
  .choice-half--right { right: 0; }

  .choice-half img {
    position: absolute;
    top: 0;
    width: 200%;
    height: 100%;
    object-fit: cover;
    filter: brightness(0.6);
    transition: filter 0.45s ease, transform 0.45s ease;
    pointer-events: none;
  }

  .choice-half--left img { left: 0; }
  .choice-half--right img { left: -100%; }

  .choice-half:hover img {
    filter: brightness(1);
    transform: scale(1.03);
  }

  .choice-divider {
    position: absolute;
    left: 50%;
    top: 0;
    width: 1px;
    height: 100%;
    background: #222;
    transform: translateX(-50%);
    pointer-events: none;
  }

  /* ─── Path routes (hidden until choice) ───────────── */
  .path-route {
    display: none;
  }

  .path-route.is-active {
    display: block;
  }

  /* ─── Path A · positioned photos ─────────────────── */
  .path-screen {
    position: relative;
    width: 100vw;
    height: 100vh;
    min-height: 100vh;
    scroll-snap-align: start;
    scroll-snap-stop: always;
    overflow: hidden;
    background: var(--bg);
    opacity: 0;
    transition: opacity 1.2s ease;
  }

  .path-screen.in-view {
    opacity: 1;
  }

  .path-screen img {
    position: absolute;
    height: auto;
    object-fit: cover;
  }

  /* ─── Path B placeholder ─────────────────────────── */
  .screen-path-b {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .screen-path-b p {
    font-size: clamp(1.2rem, 3vw, 2rem);
    letter-spacing: 0.2em;
    color: var(--text);
    font-style: italic;
  }

  /* ─── Act III ──────────────────────────────────────── */
  .screen-ending-photo,
  .screen-ending-text,
  .screen-id-photo {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
  }

  .screen-ending-photo img {
    max-width: 60vw;
    width: auto;
    height: auto;
    max-height: 80vh;
    object-fit: contain;
  }

  .screen-ending-text .epilogue {
    text-align: center;
    font-weight: 300;
    font-size: clamp(0.95rem, 2.2vw, 1.5rem);
    line-height: 2.4;
    letter-spacing: 0.08em;
    max-width: 28em;
    padding: 0 1.5rem;
    opacity: 0;
  }

  .screen-ending-text .epilogue p + p {
    margin-top: 1.2em;
  }

  .screen-ending-text.in-view .epilogue {
    animation: epilogueFade 2.5s ease forwards;
  }

  @keyframes epilogueFade {
    to { opacity: 1; }
  }

  .screen-id-photo img {
    max-height: 65vh;
    width: auto;
    max-width: 90vw;
    object-fit: contain;
    opacity: 0;
  }

  .screen-id-photo.in-view img {
    animation: idFade 2.5s ease forwards;
  }

  @keyframes idFade {
    to { opacity: 1; }
  }
</style>
</head>

<!-- ═══════════════════════════════════════════════════════ -->

<!-- ═══════════════════════════════════════════════════════ -->
<!--  ACT III — Convergence                                   -->
<!-- ═══════════════════════════════════════════════════════ -->

<div id="act-iii" class="path-route" aria-label="Act III">

  <section class="screen screen-ending-photo reveal">
    <img src="images/ending_fingerprints.jpg" alt="">

  <section class="screen screen-ending-text reveal">
    <div class="epilogue">
      <p>你的每一个选择都把你带到了不同的地方</p>
      <p>但无论你怎么选择</p>
      <p>你都在成为你自己的路上</p>
    </div>
  </section>

    <img src="images/id_photo_clean.jpg" alt="">
  </section>

</div>

<script>
(function () {
  const choiceScreen = document.getElementById('screen-choice');
  const pathA = document.getElementById('path-a');
  const pathB = document.getElementById('path-b');
  const actIII = document.getElementById('act-iii');

  function activatePath(route) {
    choiceScreen.classList.add('is-done');

    pathA.classList.remove('is-active');
    pathB.classList.remove('is-active');
    route.classList.add('is-active');
    actIII.classList.add('is-active');

    const first = route.querySelector('.path-screen, .screen');
    setTimeout(function () {
      choiceScreen.style.display = 'none';
      if (first) {
        first.scrollIntoView({ behavior: 'instant', block: 'start' });
        observeAll();
      }
    }, 1000);
  }

  function onChooseA() { activatePath(pathA); }
  function onChooseB() { activatePath(pathB); }

  document.getElementById('choose-a').addEventListener('click', onChooseA);
  document.getElementById('choose-b').addEventListener('click', onChooseB);

  document.getElementById('choose-a').addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onChooseA(); }
  });
  document.getElementById('choose-b').addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onChooseB(); }
  });

  var observer = new IntersectionObserver(function (entries) {
    entries.forEach(function (entry) {
      if (entry.isIntersecting) entry.target.classList.add('in-view');
    });
  }, { threshold: 0.12 });

  function observeAll() {
    document.querySelectorAll('.reveal, .path-screen').forEach(function (el) {
      observer.observe(el);
    });
  }

  observeAll();
})();
</script>
