<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>everyday and epic</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #0a0a0a;
  color: #e8e4df;
  font-family: 'Cormorant Garamond', serif;
  overflow-x: hidden;
}

.screen {
  width: 100vw;
  height: 100vh;
  position: relative;
  overflow: hidden;
  opacity: 0;
  transition: opacity 1.2s ease;
}
.screen.visible { opacity: 1; }
.screen img { position: absolute; object-fit: cover; height: auto; }

/* ============ CHOICE SCREEN (also opening) ============ */
#choice-screen {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  opacity: 1;
  gap: clamp(1.5rem, 3vh, 3rem);
  padding: 4rem 2rem;
}

.choice-title {
  font-family: 'Cormorant Garamond', serif;
  font-weight: 300;
  font-style: italic;
  font-size: clamp(1.5rem, 3.5vw, 2.8rem);
  letter-spacing: 0.2em;
  color: #6B1C23;
  text-transform: lowercase;
  opacity: 0;
  animation: titleIn 2s ease 0.3s forwards;
  text-align: center;
  white-space: nowrap;
}

.choice-subtitle {
  font-family: 'Cormorant Garamond', serif;
  font-weight: 300;
  font-style: italic;
  font-size: clamp(0.85rem, 1.4vw, 1.15rem);
  letter-spacing: 0.6em;
  color: #aaa;
  text-transform: lowercase;
  opacity: 0;
  animation: subIn 2s ease 2.2s forwards;
  margin-top: clamp(1.5rem, 3vh, 2.5rem);
}

@keyframes titleIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes subIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

.choice-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: clamp(1.5rem, 4vw, 5rem);
  margin-top: clamp(1rem, 3vh, 3rem);
}

.choice-btn {
  cursor: pointer;
  border: none;
  background: none;
  padding: 0;
  opacity: 0;
  animation: faceIn 2s ease 1.5s forwards;
}
@keyframes faceIn {
  from { opacity: 0; }
  to { opacity: 1; }
}
.choice-btn img {
  position: relative;
  height: clamp(220px, 50vh, 460px);
  width: auto;
  object-fit: contain;
  filter: brightness(1);
  transition: filter 0.6s, transform 0.6s, opacity 0.6s;
}
.choice-btn:hover img {
  filter: brightness(1.1);
  transform: scale(1.03);
}
.choice-row:hover .choice-btn:not(:hover) img {
  filter: brightness(0.5);
}
.choice-divider {
  width: 1px;
  height: clamp(100px, 25vh, 240px);
  background: #222;
  opacity: 0;
  animation: faceIn 2s ease 1.5s forwards;
}

/* ============ PATH CONTAINERS ============ */
.path-container { display: none; }
.path-container.active { display: block; }
#shared-ending { display: none; }
#shared-ending.active { display: block; }

/* ============ ENDING ============ */
#ending-fingerprint {
  display: flex;
  align-items: center;
  justify-content: center;
}
#ending-fingerprint img {
  position: relative;
  max-width: 60vw;
  max-height: 80vh;
  object-fit: contain;
  opacity: 0;
  transition: opacity 2.5s ease;
}
#ending-fingerprint img.visible { opacity: 1; }

#ending-text {
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 3rem;
}
#ending-text p {
  font-size: clamp(0.95rem, 2.2vw, 1.5rem);
  font-weight: 300;
  line-height: 2.4;
  letter-spacing: 0.06em;
  max-width: 600px;
  opacity: 0;
  transition: opacity 2.5s ease;
}
#ending-text p.visible { opacity: 1; }

#ending-photo {
  display: flex;
  align-items: center;
  justify-content: center;
}
#ending-photo img {
  position: relative;
  max-height: 65vh;
  max-width: 55vw;
  object-fit: contain;
  opacity: 0;
  transition: opacity 2.5s ease;
}
#ending-photo img.visible { opacity: 1; }

/* ============ FINAL "WALK ANOTHER WAY" SCREEN ============ */
#walk-back {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  gap: clamp(1.5rem, 4vh, 3rem);
  padding: 3rem;
}
.walk-link {
  font-family: 'Cormorant Garamond', serif;
  font-weight: 300;
  font-style: italic;
  font-size: clamp(1.4rem, 3.5vw, 2.6rem);

  color: #e8e4df;
  background: none;
  border: none;
  cursor: pointer;
  padding: 0.5rem 1rem;
  opacity: 0;
  transition: opacity 2.5s ease, color 0.6s, letter-spacing 0.6s;
  text-transform: lowercase;
}
.walk-link.visible { opacity: 1; }

  letter-spacing: 0.25em;
}
.walk-sub-en {

}
.walk-sub-en.visible { opacity: 1; }
.walk-sub-zh {
  font-weight: 300;
  font-size: clamp(0.75rem, 1.2vw, 0.95rem);
  letter-spacing: 0.4em;
  color: #555;
  opacity: 0;
  transition: opacity 2.5s ease 0.8s;
}
.walk-sub-zh.visible { opacity: 1; }

.scroll-hint {
  position: fixed;
  bottom: 1.5rem;
  left: 50%;
  transform: translateX(-50%);
  font-size: 0.6rem;
  letter-spacing: 0.5em;
  color: #333;
  z-index: 99;
  transition: opacity 1s;
}
.scroll-hint.gone { opacity: 0; pointer-events: none; }
</style>

<script>
function choosePath(path) {
  const choice = document.getElementById('choice-screen');
  choice.style.transition = 'opacity 1s ease';
  choice.style.opacity = '0';
  setTimeout(() => {
    choice.style.display = 'none';
    document.getElementById(path === 'A' ? 'pathA' : 'pathB').classList.add('active');
    document.getElementById('shared-ending').classList.add('active');
    observeAll();
    window.scrollTo({ top: 0, behavior: 'instant' });
    setTimeout(() => {
      const target = document.querySelector((path === 'A' ? '#pathA' : '#pathB') + ' .screen');
      if (target) target.scrollIntoView({ behavior: 'smooth' });
    }, 200);
  }, 1000);
}

function walkAnotherWay() {
  // Fade out current screens, reset to choice
  document.body.style.transition = 'opacity 0.8s ease';
  document.body.style.opacity = '0';
  setTimeout(() => {
    document.getElementById('pathA').classList.remove('active');
    document.getElementById('pathB').classList.remove('active');
    document.getElementById('shared-ending').classList.remove('active');
    const choice = document.getElementById('choice-screen');
    choice.style.display = 'flex';
    choice.style.opacity = '1';
    // reset visited classes
    document.querySelectorAll('.screen.visible').forEach(s => {
      if (s.id !== 'choice-screen') s.classList.remove('visible');
    });
    document.querySelectorAll('.walk-link, .walk-sub-en, .walk-sub-zh, #ending-text p, #ending-photo img, #ending-fingerprint img').forEach(el => el.classList.remove('visible'));
    window.scrollTo({ top: 0, behavior: 'instant' });
    document.body.style.opacity = '1';
  }, 800);
}

function observeAll() {
  const obs = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (e.isIntersecting) {
        e.target.classList.add('visible');
        e.target.querySelectorAll('#ending-text p, #ending-photo img, #ending-fingerprint img, .walk-link, .walk-sub-en, .walk-sub-zh').forEach(el => el.classList.add('visible'));
      }
    });
  }, { threshold: 0.15 });
  document.querySelectorAll('.screen').forEach(s => obs.observe(s));
}

let hinted = false;
window.addEventListener('scroll', () => {
  if (!hinted && scrollY > 80) { hinted = true; document.getElementById('sh').classList.add('gone'); }
}, { passive: true });

observeAll();
</script>
