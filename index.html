<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&display=swap"></noscript>
<style>

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  background: #0a0a0a;
  width: 100%;
  overflow-x: hidden;
}

body {
  color: #e8e4df;
  font-family: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
}

/* ===== Scale wrapper: keeps desktop 16:9 layout, scales for any screen width ===== */
#scale-wrap {
  width: 1920px;
  transform-origin: top left;
  /* JS sets transform: scale() based on viewport width */
}

.screen {
  width: 1920px;
  height: 1080px;
  position: relative;
  overflow: hidden;
  opacity: 0;
  transition: opacity 1.2s ease;
  contain: layout style paint;
  contain-intrinsic-size: 1920px 1080px;
}
.screen.visible { opacity: 1; }
.screen img { position: absolute; object-fit: cover; height: auto; }

/* ============ CHOICE SCREEN (also opening) ============ */
#choice-screen {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  opacity: 1;
  gap: 40px;
  padding: 80px 40px;
}

.choice-title {
  font-family: 'Cormorant Garamond', serif;
  font-weight: 300;
  font-style: italic;
  font-size: 52px;
  letter-spacing: 0.2em;
  color: #6B1C23;
  text-transform: lowercase;
  opacity: 0;
  animation: titleIn 2s ease 0.3s forwards;
  text-align: center;
  white-space: nowrap;
}

.choice-subtitle {
  font-family: 'Cormorant Garamond', serif;
  font-weight: 300;
  font-style: italic;
  font-size: 20px;
  letter-spacing: 0.6em;
  color: #aaa;
  text-transform: lowercase;
  opacity: 0;
  animation: subIn 2s ease 2.2s forwards;
  margin-top: 40px;
}

@keyframes titleIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes subIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

.choice-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 80px;
  margin-top: 40px;
}

.choice-btn {
  cursor: pointer;
  border: none;
  background: none;
  padding: 0;
  opacity: 0;
  animation: faceIn 2s ease 1.5s forwards;
}
@keyframes faceIn {
  from { opacity: 0; }
  to { opacity: 1; }
}
.choice-btn img {
  position: relative;
  height: 540px;
  width: auto;
  object-fit: contain;
  filter: brightness(1);
  transition: filter 0.6s, transform 0.6s, opacity 0.6s;
}
.choice-btn:hover img {
  filter: brightness(1.1);
  transform: scale(1.03);
}
.choice-row:hover .choice-btn:not(:hover) img {
  filter: brightness(0.5);
}
.choice-divider {
  width: 1px;
  height: 280px;
  background: #222;
  opacity: 0;
  animation: faceIn 2s ease 1.5s forwards;
}

/* ============ PATH CONTAINERS ============ */
.path-container { display: none; }
.path-container.active { display: block; }
#shared-ending { display: none; }
#shared-ending.active { display: block; }

/* ============ FINAL "WALK ANOTHER WAY" SCREEN ============ */
#walk-back {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  gap: 48px;
  padding: 48px;
}
.walk-link {
  font-family: 'Cormorant Garamond', serif;
  font-weight: 300;
  font-style: italic;
  font-size: 52px;
  letter-spacing: 0.15em;
  color: #e8e4df;
  background: none;
  border: none;
  cursor: pointer;
  padding: 8px 16px;
  opacity: 0;
  transition: opacity 2.5s ease, color 0.6s, letter-spacing 0.6s;
  text-transform: lowercase;
}
.walk-link.visible { opacity: 1; }
.walk-link:hover {
  color: #6B1C23;
  letter-spacing: 0.25em;
}
.walk-sub-en {
  font-style: italic;
  font-weight: 300;
  font-size: 22px;
  letter-spacing: 0.18em;
  color: #888;
  opacity: 0;
  transition: opacity 2.5s ease 0.4s;
}
.walk-sub-en.visible { opacity: 1; }

.scroll-hint {
  position: fixed;
  bottom: 1.5rem;
  left: 50%;
  transform: translateX(-50%);
  font-size: 0.6rem;
  letter-spacing: 0.5em;
  color: #333;
  z-index: 99;
  transition: opacity 1s;
}
.scroll-hint.gone { opacity: 0; pointer-events: none; }

/* Mobile scroll snap; desktop layout unchanged (JS scales) */
@media (max-width: 767px) {
  html {
    scroll-snap-type: y proximity;
    -webkit-overflow-scrolling: touch;
  }
  .screen {
    scroll-snap-align: start;
  }
}
/* B 竖屏：整屏完整显示画布，略加强吸附 */
@media (max-width: 767px) and (orientation: portrait) {
  html { scroll-snap-type: y mandatory; }
}
</style>

<script>
/* ===== Scaling modes (same 1920×1080 layout, no HTML changes) =====
 * PC:     width-fit — unchanged
 * A 横屏: height-fit — phone landscape, one screen fills viewport height
 * B 竖屏: contain-fit — phone portrait, full canvas visible, scroll per screen
 */
const DESIGN_W = 1920;
const DESIGN_H = 1080;
const MOBILE_BP = 768;

function getViewportSize() {
  const vv = window.visualViewport;
  return {
    width: vv ? vv.width : window.innerWidth,
    height: vv ? vv.height : window.innerHeight
  };
}

function getScaleMode(vw, vh) {
  if (vw >= MOBILE_BP) return 'desktop';
  return vh > vw ? 'mobile-b' : 'mobile-a';
}

let scaleRaf = 0;
function scaleApp() {
  const wrap = document.getElementById('scale-wrap');
  if (!wrap) return;

  const { width: vw, height: vh } = getViewportSize();
  const mode = getScaleMode(vw, vh);
  let scale;

  if (mode === 'desktop') {
    scale = vw / DESIGN_W;
  } else if (mode === 'mobile-a') {
    scale = vh / DESIGN_H;
  } else {
    scale = Math.min(vw / DESIGN_W, vh / DESIGN_H);
  }

  wrap.style.width = DESIGN_W + 'px';
  wrap.style.transformOrigin = 'top left';
  wrap.style.transform = 'scale(' + scale + ')';

  if (mode === 'desktop') {
    wrap.style.marginLeft = '0px';
  } else {
    const scaledW = DESIGN_W * scale;
    wrap.style.marginLeft = Math.max(0, (vw - scaledW) / 2) + 'px';
  }

  const layoutH = wrap.offsetHeight;
  wrap.style.marginBottom = (layoutH * (scale - 1)) + 'px';

  document.documentElement.dataset.scaleMode = mode;
  document.documentElement.style.setProperty('--app-scale', String(scale));
}

function scheduleScaleApp() {
  cancelAnimationFrame(scaleRaf);
  scaleRaf = requestAnimationFrame(scaleApp);
}

function scrollToTop(behavior) {
  const y = 0;
  try {
    window.scrollTo({ top: y, left: 0, behavior: behavior || 'auto' });
  } catch (e) {
    window.scrollTo(0, y);
  }
}

function scrollToScreen(el, behavior) {
  if (!el) return;
  const y = el.getBoundingClientRect().top + window.scrollY;
  try {
    window.scrollTo({ top: y, left: 0, behavior: behavior || 'smooth' });
  } catch (e) {
    window.scrollTo(0, y);
  }
}

window.addEventListener('resize', scheduleScaleApp);
window.addEventListener('orientationchange', scheduleScaleApp);
window.addEventListener('load', scheduleScaleApp);
let scaleDebounceTid = 0;
function debounceScaleApp(ms) {
  clearTimeout(scaleDebounceTid);
  scaleDebounceTid = setTimeout(scheduleScaleApp, ms);
}
function onVVResize() {
  const vv = window.visualViewport;
  // pinch-zoom: scale > 1 means user is actively zooming — wait longer before recalculating
  debounceScaleApp((vv && vv.scale > 1.01) ? 200 : 120);
}
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', onVVResize);
}
scheduleScaleApp();

document.querySelectorAll('#choice-screen img').forEach(function (img) {
  img.loading = 'eager';
  img.decoding = 'async';
});

let renderObs = null;

function initRenderObserver() {
  if (renderObs) { renderObs.disconnect(); renderObs = null; }
  var scale = parseFloat(
    getComputedStyle(document.documentElement).getPropertyValue('--app-scale') || '1'
  );
  // rootMargin = 1 screen-height in viewport-px, correcting for transform:scale distortion
  var margin = Math.round(1080 * scale) + 'px 0px';
  renderObs = new IntersectionObserver(function(entries) {
    entries.forEach(function(e) {
      e.target.style.contentVisibility = e.isIntersecting ? '' : 'hidden';
    });
  }, { rootMargin: margin });
  document.querySelectorAll(
    '.path-container.active .screen, #shared-ending.active .screen'
  ).forEach(function(s) { renderObs.observe(s); });
}

function choosePath(path) {
  const choice = document.getElementById('choice-screen');
  choice.style.transition = 'opacity 1s ease';
  choice.style.opacity = '0';
  setTimeout(() => {
    choice.style.display = 'none';
    document.getElementById(path === 'A' ? 'pathA' : 'pathB').classList.add('active');
    document.getElementById('shared-ending').classList.add('active');
    scheduleScaleApp();
    observeAll();
    initRenderObserver();
    scrollToTop('auto');
    setTimeout(() => {
      scheduleScaleApp();
      const target = document.querySelector((path === 'A' ? '#pathA' : '#pathB') + ' .screen');
      scrollToScreen(target, 'smooth');
    }, 200);
  }, 1000);
}

function walkAnotherWay() {
  // Fade out current screens, reset to choice
  document.body.style.transition = 'opacity 0.8s ease';
  document.body.style.opacity = '0';
  setTimeout(() => {
    if (renderObs) { renderObs.disconnect(); renderObs = null; }
    document.querySelectorAll('.path-container .screen, #shared-ending .screen')
      .forEach(function(s) { s.style.contentVisibility = ''; });
    document.getElementById('pathA').classList.remove('active');
    document.getElementById('pathB').classList.remove('active');
    document.getElementById('shared-ending').classList.remove('active');
    const choice = document.getElementById('choice-screen');
    choice.style.display = 'flex';
    choice.style.opacity = '1';
    // reset visited classes
    document.querySelectorAll('.screen.visible').forEach(s => {
      if (s.id !== 'choice-screen') s.classList.remove('visible');
    });
    document.querySelectorAll('.walk-link, .walk-sub-en').forEach(el => el.classList.remove('visible'));
    scrollToTop('auto');
    scheduleScaleApp();
    document.body.style.opacity = '1';
  }, 800);
}

function loadScreenImgs(screen) {
  screen.querySelectorAll('img[data-src]').forEach(function (img) {
    img.src = img.dataset.src;
    img.decoding = 'async';
    img.removeAttribute('data-src');
  });
}

function observeAll() {
  const obs = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (e.isIntersecting) {
        e.target.classList.add('visible');
        e.target.querySelectorAll('.walk-link, .walk-sub-en').forEach(el => el.classList.add('visible'));
        loadScreenImgs(e.target);
        var next = e.target.nextElementSibling;
        if (next && next.classList.contains('screen')) loadScreenImgs(next);
        obs.unobserve(e.target);
      }
    });
  }, { threshold: 0.15 });
  document.querySelectorAll('.screen').forEach(s => obs.observe(s));
}

let hinted = false;
window.addEventListener('scroll', () => {
  if (!hinted && scrollY > 80) { hinted = true; document.getElementById('sh').classList.add('gone'); }
}, { passive: true });

observeAll();
</script>
